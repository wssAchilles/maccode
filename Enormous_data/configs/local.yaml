app:
  name: ecommerce-behavior-dashboard

spark:
  master: local[4]
  shuffle_partitions: 8
  timezone: Asia/Shanghai
  configs:
    spark.driver.memory: 6g
    spark.driver.maxResultSize: 512m
    spark.default.parallelism: 8
    spark.sql.adaptive.enabled: true
    spark.sql.adaptive.coalescePartitions.enabled: true
    spark.sql.adaptive.skewJoin.enabled: true
    spark.sql.files.maxPartitionBytes: 67108864
    spark.sql.inMemoryColumnarStorage.batchSize: 1000
    spark.pyspark.python: /Users/achilles/Documents/code/Enormous_data/.venv/bin/python
    spark.pyspark.driver.python: /Users/achilles/Documents/code/Enormous_data/.venv/bin/python
    spark.python.worker.reuse: false

data:
  input_path: data/sample/ecommerce_user_sample_1pct.csv
  input_format: csv
  delimiter: ","
  output_dir: data/cache
  processed_dir: data/processed
  limit:
  top_n: 10

quality:
  thresholds:
    max_removed_ratio: 0.25
    max_invalid_price_rows: 0
    min_cleaned_rows: 1
    max_ordering_anomaly_ratio: 0.05
    max_purchase_missing_price_ratio: 0.01
    min_session_fact_rows: 1

feature_mart:
  preview_limit: 50
  max_freshness_lag_hours: 88333
  late_arrival_days: 7
  max_duplicate_event_key_rate: 0.01
  max_quarantined_rate: 0.05

affinity:
  preview_limit: 120
  top_nodes: 120
  max_edges: 200
  min_support: 2
  max_pair_products_per_session: 20
  min_eligible_sessions: 2

attribution:
  preview_limit: 120
  min_purchase_rows: 2
  min_attribution_coverage_rate: 0.2
  time_decay_base: 0.7
  top_paths: 40

cohort:
  preview_limit: 120
  cohort_unit: month
  min_cohort_users: 2
  max_period_index: 3
  high_risk_retention_drop: -0.3

cart_recovery:
  preview_limit: 120
  min_cart_sessions: 2
  min_history_days: 2
  high_abandonment_rate: 0.65

portfolio:
  preview_limit: 120
  min_purchase_rows: 2
  min_history_days: 2
  min_valid_price_purchase_rate: 0.98
  top_products: 100

forecasting:
  forecast_horizon_days: 7
  training_window_days: 28
  backtest_window_days: 7
  preview_limit: 100
  top_entities: 12
  min_history_days: 2
  max_site_wape: 0.45
  high_risk_drop_rate: -0.15
  medium_risk_drop_rate: -0.08
  history_collect_days: 90
  max_driver_history_rows: 2000

journey:
  preview_limit: 100
  max_path_events: 8
  min_path_sessions: 1
  min_transition_count: 1

anomaly:
  preview_limit: 100
  max_alerts: 100
  min_baseline_points: 3
  warning_z: 3.5
  critical_z: 6.0
  min_volume: 20

lifecycle:
  preview_limit: 100
  high_value_revenue: 500
  loyal_purchase_days: 2
  active_days: 3
  at_risk_recency_days: 14
  champion_min_revenue: 1000
  champion_min_purchase_days: 2

experimentation:
  preview_limit: 100
  treatment_split: 0.5
  min_treatment_users: 2
  min_control_users: 2
  max_segment_imbalance: 0.45
  min_assignment_users: 3

optimization:
  candidate_limit: 50
  plan_limit: 20
  total_budget: 2000
  slot_count: 5
  category_cap: 8
  brand_cap: 4
  min_views: 1
  min_confidence: 0.01
  risk_lambda: 0.25
  time_limit_seconds: 5
  mip_gap: 0.03

recommendation:
  top_k: 5
  session_sample_limit: 100
  candidate_pool: 40
  min_confidence: 0.01
  min_coverage_rate: 0.6
  max_fallback_rate: 0.9
  min_avg_confidence: 0.01
  max_freshness_lag_minutes: 5300000
