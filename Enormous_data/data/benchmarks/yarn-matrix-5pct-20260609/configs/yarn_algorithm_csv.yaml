app:
  name: ecommerce-yarn-algorithm-5pct
spark:
  master: yarn
  deploy_mode: client
  shuffle_partitions: 8
  timezone: Asia/Shanghai
  configs:
    spark.submit.deployMode: client
    spark.driver.memory: 1536m
    spark.driver.memoryOverhead: 512m
    spark.driver.maxResultSize: 256m
    spark.executor.instances: 1
    spark.executor.cores: 1
    spark.executor.memory: 1g
    spark.executor.memoryOverhead: 1536m
    spark.executor.pyspark.memory: 384m
    spark.pyspark.python: /usr/local/bin/python3.11
    spark.pyspark.driver.python: /usr/local/bin/python
    spark.executorEnv.PYSPARK_PYTHON: /usr/local/bin/python3.11
    spark.sql.shuffle.partitions: 8
    spark.default.parallelism: 8
    spark.sql.adaptive.enabled: true
    spark.sql.adaptive.coalescePartitions.enabled: true
    spark.sql.adaptive.skewJoin.enabled: true
    spark.sql.adaptive.localShuffleReader.enabled: true
    spark.sql.adaptive.coalescePartitions.initialPartitionNum: 8
    spark.sql.ui.explainMode: simple
    spark.serializer: org.apache.spark.serializer.JavaSerializer
    spark.memory.fraction: 0.4
    spark.python.worker.reuse: true
    spark.sql.files.maxPartitionBytes: 134217728
    spark.sql.files.openCostInBytes: 4194304
    spark.sql.autoBroadcastJoinThreshold: 33554432
    spark.network.timeout: 600s
    spark.executor.heartbeatInterval: 60s
    spark.eventLog.enabled: true
    spark.eventLog.dir: hdfs:///spark-history
    spark.eventLog.compress: true
    spark.eventLog.logStageExecutorMetrics: false
    spark.eventLog.rolling.enabled: true
    spark.eventLog.rolling.maxFileSize: 64m
    spark.ui.retainedJobs: 120
    spark.ui.retainedStages: 240
    spark.ui.retainedTasks: 2000
    spark.sql.ui.retainedExecutions: 120
    spark.ui.timelineEnabled: false
data:
  input_path: hdfs:///user/course/ecommerce_behavior_user_sample_5pct/*.csv
  input_format: csv
  delimiter: ','
  output_dir: data/cache
  processed_dir: hdfs:///user/course/ecommerce_behavior_processed_yarn_algorithm_5pct
  limit: null
  top_n: 20
storage:
  mode: hdfs
  fallback_to_local: false
quality:
  thresholds:
    max_removed_ratio: 0.25
    max_invalid_price_rows: 20
    min_cleaned_rows: 1
    max_ordering_anomaly_ratio: 0.1
    max_purchase_missing_price_ratio: 0.01
    min_session_fact_rows: 1
feature_mart:
  preview_limit: 100
  max_freshness_lag_hours: 88333
  late_arrival_days: 7
  max_duplicate_event_key_rate: 0.01
  max_quarantined_rate: 0.05
affinity:
  preview_limit: 120
  top_nodes: 120
  max_edges: 200
  min_support: 3
  max_pair_products_per_session: 15
  min_eligible_sessions: 10
attribution:
  preview_limit: 120
  min_purchase_rows: 100
  min_attribution_coverage_rate: 0.5
  time_decay_base: 0.7
  top_paths: 80
cohort:
  preview_limit: 120
  cohort_unit: month
  min_cohort_users: 100
  min_cohort_observation_days: 7
  max_period_index: 3
  high_risk_retention_drop: -0.3
cart_recovery:
  preview_limit: 120
  min_cart_sessions: 100
  min_history_days: 7
  high_abandonment_rate: 0.65
portfolio:
  preview_limit: 120
  min_purchase_rows: 100
  min_history_days: 7
  min_valid_price_purchase_rate: 0.98
  top_products: 100
forecasting:
  forecast_horizon_days: 7
  training_window_days: 28
  backtest_window_days: 7
  preview_limit: 100
  top_entities: 12
  min_history_days: 7
  max_site_wape: 0.35
  min_trailing_day_actual_ratio: 0.5
  high_risk_drop_rate: -0.15
  medium_risk_drop_rate: -0.08
  history_collect_days: 90
  max_driver_history_rows: 2000
journey:
  preview_limit: 100
  max_path_events: 8
  min_path_sessions: 2
  min_transition_count: 2
anomaly:
