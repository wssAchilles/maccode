  high_value_revenue: 500
  loyal_purchase_days: 2
  active_days: 3
  at_risk_recency_days: 14
  champion_min_revenue: 1000
  champion_min_purchase_days: 2
experimentation:
  preview_limit: 100
  treatment_split: 0.5
  min_treatment_users: 20
  min_control_users: 20
  max_segment_imbalance: 0.35
  min_assignment_users: 50
optimization:
  candidate_limit: 100
  plan_limit: 30
  total_budget: 5000
  slot_count: 8
  category_cap: 12
  brand_cap: 6
  min_views: 20
  min_confidence: 0.03
  risk_lambda: 0.25
  time_limit_seconds: 10
  mip_gap: 0.02
recommendation:
  top_k: 5
  session_sample_limit: 500
  candidate_pool: 80
  preview_limit: 1000
  min_confidence: 0.02
  min_coverage_rate: 0.75
  max_fallback_rate: 0.8
  min_avg_confidence: 0.03
  max_freshness_lag_minutes: 5300000
