runtime: python311  # 运行时环境：指定 Python 3.11

# 启动命令：
# GAE 将使用 gunicorn 来启动 Flask 应用
# --timeout 300: 增加工作进程超时时间到 5 分钟（用于模型训练任务）
# --workers 1: 保持单 worker，避免在 F4 上因多进程重复加载大型依赖导致内存抖动
# --threads 8: 提高 I/O 并发，减少 Cloud Tasks 执行期间 jobs/dashboard 轮询排队
entrypoint: gunicorn -b :$PORT --timeout 300 --workers 1 --threads 8 main:app

instance_class: F4  # 实例类型：F4 高性能实例，解决 Pandas/Scikit-learn 内存溢出问题

# 自动扩缩容配置（成本控制的关键！）
automatic_scaling:
  min_instances: 0      # 最小实例数：0 (没有流量时关闭，不产生费用)
  max_instances: 4      # 最大实例数：4 (允许内部任务和前台轮询并行)
  min_idle_instances: 0 # 最小空闲实例：0
  max_idle_instances: 2 # 最大空闲实例：2
  min_pending_latency: 500ms    # 更快触发扩容，减少轮询请求排队
  max_pending_latency: automatic
  target_cpu_utilization: 0.8   # CPU 利用率目标 80%
  target_throughput_utilization: 0.8

# 请求超时配置
inbound_services:
- warmup  # 启用预热请求，减少冷启动延迟

# 环境变量配置
# ⚠️ 敏感信息已移至 Secret Manager 管理
# 此模板文件可安全提交到 Git
env_variables:
  # GCP 配置（非敏感）
  STORAGE_BUCKET_NAME: "data-science-44398.firebasestorage.app"
  GCP_PROJECT_ID: "data-science-44398"
  FIRESTORE_DATABASE: "my-datasci-project-bucket"
  TASKS_EXECUTION_MODE: "cloud_tasks"
  TASKS_QUEUE_NAME: "industrial-jobs"
  TASKS_LOCATION: "asia-northeast1"
  INTERNAL_BASE_URL: "https://data-science-44398.an.r.appspot.com"
  ORCHESTRATOR_BASE_URL: ""
  
  # 位置配置（非敏感）
  WEATHER_CITY_LAT: "34.05"   # Los Angeles Latitude
  WEATHER_CITY_LON: "-118.24" # Los Angeles Longitude
  
  # Flask 配置
  FLASK_ENV: "production"
  
  # ============================================================
  # 以下密钥已迁移到 Google Secret Manager
  # 运行时通过 services/secrets.py 自动获取
  # ============================================================
  # GRB_LICENSEID: [已移至 Secret Manager]
  # GRB_WLSACCESSID: [已移至 Secret Manager]
  # GRB_WLSSECRET: [已移至 Secret Manager]
  # OPENWEATHER_API_KEY: [已移至 Secret Manager]

# 处理器配置
handlers:
# 健康检查端点（不需要认证）
- url: /api/health
  script: auto
  secure: always

# Cron 任务端点（GAE 内部调用）
- url: /tasks/.*
  script: auto
  secure: always
  login: admin  # 只允许管理员或 Cron 服务访问

# API 端点
- url: /api/.*
  script: auto
  secure: always

# 默认处理器
- url: /.*
  script: auto
  secure: always
