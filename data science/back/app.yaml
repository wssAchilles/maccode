runtime: python311  # 运行时环境：指定 Python 3.11

# 启动命令：
# GAE 将使用 gunicorn 来启动 Flask 应用
# --timeout 300: 增加工作进程超时时间到 5 分钟（用于模型训练任务）
# --workers 1: 保持单 worker，避免多进程重复加载大型依赖导致内存抖动
# --threads 6: 保留控制面 I/O 并发，同时降低小规格实例的常驻内存压力
entrypoint: gunicorn -b :$PORT --timeout 300 --workers 1 --threads 6 main:app

instance_class: F2  # 默认服务只承担轻量 API 与控制面，中重计算已迁往 Cloud Run

# 自动扩缩容配置（成本控制的关键！）
automatic_scaling:
  min_instances: 0      # 最小实例数：0 (没有流量时关闭，不产生费用)
  max_instances: 3      # 最大实例数：3 (控制面足够，避免无意义扩容)
  min_idle_instances: 0 # 最小空闲实例：0
  max_idle_instances: 1 # 最大空闲实例：1，减少空闲保活成本
  min_pending_latency: 500ms    # 更快触发扩容，减少轮询请求排队
  max_pending_latency: automatic
  target_cpu_utilization: 0.75  # 更早触发扩容，避免降配后前台体感变差
  target_throughput_utilization: 0.75

# 请求超时配置
inbound_services:
- warmup  # 启用预热请求，减少冷启动延迟

# 环境变量配置
# ⚠️ 敏感信息已移至 Secret Manager 管理
# 此模板文件可安全提交到 Git
env_variables:
  # GCP 配置（非敏感）
  STORAGE_BUCKET_NAME: "data-science-44398.firebasestorage.app"
  GCP_PROJECT_ID: "data-science-44398"
  FIRESTORE_DATABASE: "my-datasci-project-bucket"
  TASKS_EXECUTION_MODE: "cloud_tasks"
  TASKS_QUEUE_NAME: "industrial-jobs"
  TASKS_LOCATION: "asia-northeast1"
  INTERNAL_BASE_URL: "https://data-science-44398.an.r.appspot.com"
  HEAVY_SERVICE_URL: "https://sentinel-backend-cloudrun-nj4m3gcxqq-uc.a.run.app"
  RAG_BACKEND_MODE: "storage_fallback"
  ORCHESTRATOR_BASE_URL: "https://sentinel-orchestrator-nj4m3gcxqq-an.a.run.app"
  ORCHESTRATOR_MAX_LIGHT_PARALLEL: "4"
  ORCHESTRATOR_MAX_HEAVY_PARALLEL: "2"
  ORCHESTRATOR_DISPATCH_TIMEOUT_S: "1800"
  ML_TRAIN_BACKEND_DEFAULT: "vertex_custom_training"
  ML_TRAIN_VERTEX_ENABLED: "true"
  ML_TRAIN_VERTEX_ROLLOUT_MODE: "manual_all"
  ML_TRAIN_VERTEX_MIN_FILE_SIZE_BYTES: "0"
  ML_TRAIN_VERTEX_MAX_PARALLEL_JOBS: "2"
  ML_TRAIN_VERTEX_MAX_RUNTIME_S: "7200"
  ML_TRAIN_VERTEX_CPU_ONLY: "true"
  ML_TRAIN_VERTEX_RECONCILE_DELAY_S: "30"
  VERTEX_REGION: "us-central1"
  VERTEX_TRAINING_IMAGE_URI: "us-central1-docker.pkg.dev/data-science-44398/sentinel-jobs/vertex-trainer:latest"
  VERTEX_TRAINING_STAGING_BUCKET: "data-science-44398-vertex-training-us-central1"
  VERTEX_TRAINING_SERVICE_ACCOUNT: "vertex-trainer-sa@data-science-44398.iam.gserviceaccount.com"
  VERTEX_TRAINING_MACHINE_TYPE: "n1-standard-4"
  VERTEX_TRAINING_ACCELERATOR_TYPE: ""
  VERTEX_TRAINING_ACCELERATOR_COUNT: "0"
  TRAINING_CALLBACK_BASE_URL: "https://data-science-44398.an.r.appspot.com"
  COMPUTE_PROFILE_ENABLED: "true"
  COMPUTE_PROFILE_WINDOW: "24"
  COMPUTE_GOVERNANCE_COLLECTION: "runtime_governance"
  COMPUTE_FEATURE_WARNING_MS: "200"
  COMPUTE_SCENARIO_WARNING_MS: "450"
  COMPUTE_NATIVE_ENABLED: "false"
  COMPUTE_NATIVE_MODULE: "rolling_features_native"
  COMPUTE_NATIVE_GUARD_ENABLED: "true"
  COMPUTE_NATIVE_GUARD_FAILURE_THRESHOLD: "3"
  COMPUTE_NATIVE_GUARD_WINDOW_MINUTES: "30"
  COMPUTE_FEATURE_NATIVE_MIN_SPEEDUP: "1.15"
  COMPUTE_SCENARIO_VECTOR_MIN_SPEEDUP: "1.05"
  COMPUTE_BENCHMARK_STALE_HOURS: "168"
  
  # 位置配置（非敏感）
  WEATHER_CITY_LAT: "34.05"   # Los Angeles Latitude
  WEATHER_CITY_LON: "-118.24" # Los Angeles Longitude
  
  # Flask 配置
  FLASK_ENV: "production"
  
  # ============================================================
  # 以下密钥已迁移到 Google Secret Manager
  # 运行时通过 services/secrets.py 自动获取
  # ============================================================
  # GRB_LICENSEID: [已移至 Secret Manager]
  # GRB_WLSACCESSID: [已移至 Secret Manager]
  # GRB_WLSSECRET: [已移至 Secret Manager]
  # OPENWEATHER_API_KEY: [已移至 Secret Manager]

# 处理器配置
handlers:
# 健康检查端点（不需要认证）
- url: /api/health
  script: auto
  secure: always

# Cron 任务端点（GAE 内部调用）
- url: /tasks/.*
  script: auto
  secure: always
  login: admin  # 只允许管理员或 Cron 服务访问

# API 端点
- url: /api/.*
  script: auto
  secure: always

# 默认处理器
- url: /.*
  script: auto
  secure: always
