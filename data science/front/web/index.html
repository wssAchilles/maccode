<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="description"
    content="Sentinel Ops industrial cockpit for optimization, data analysis, AI workflows, and audit operations."
  >
  <!-- Fix for verifyAuth popup closed by user error -->
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sentinel Ops">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Sentinel Ops</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #boot-fallback {
      position: fixed;
      inset: 24px;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      pointer-events: none;
      font-family: "DM Sans", "Segoe UI", sans-serif;
      color: #0f172a;
    }

    #boot-fallback[data-visible="true"] {
      display: flex;
    }

    #boot-fallback .boot-card {
      width: min(560px, calc(100vw - 48px));
      padding: 24px;
      border-radius: 24px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.14);
      pointer-events: auto;
    }

    #boot-fallback h1 {
      margin: 0 0 10px;
      font-size: 22px;
      line-height: 1.2;
    }

    #boot-fallback p {
      margin: 0 0 16px;
      font-size: 14px;
      line-height: 1.6;
      color: #475569;
    }

    #boot-fallback .boot-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    #boot-fallback button {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    #boot-fallback .primary {
      background: #2563eb;
      color: #fff;
    }

    #boot-fallback .secondary {
      background: #e2e8f0;
      color: #0f172a;
    }

    #boot-fallback pre {
      margin: 0;
      padding: 14px 16px;
      border-radius: 16px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 240px;
      overflow: auto;
    }
  </style>
</head>

<body>
  <div id="boot-fallback" aria-live="polite">
    <div class="boot-card">
      <h1>应用初始化失败</h1>
      <p>
        页面资源已经返回，但 Flutter 工作台没有成功挂起。请先尝试重新加载；如果问题持续存在，再清理缓存后重试。
      </p>
      <div class="boot-actions">
        <button class="primary" type="button" onclick="window.location.reload()">
          重新加载
        </button>
        <button
          class="secondary"
          type="button"
          onclick="navigator.clipboard && navigator.clipboard.writeText(document.getElementById('boot-diagnostics')?.innerText || '')"
        >
          复制诊断信息
        </button>
      </div>
      <pre id="boot-diagnostics">正在收集启动诊断…</pre>
    </div>
  </div>
  <script>
    (function registerBootWatchdog() {
      const fallback = document.getElementById('boot-fallback');
      const diagnostics = document.getElementById('boot-diagnostics');
      const startedAt = Date.now();
      const issues = [];
      let bootResolved = false;
      let timeoutReached = false;
      let timeoutReported = false;
      let bootProbe = null;
      const flutterRootSelector =
        'flutter-view, flt-semantics-host, flt-semantics-placeholder, flt-glass-pane, flt-scene-host, canvas';
      const paintedRootSelector = 'flt-glass-pane, flt-scene-host, canvas';

      const pushIssue = (label, value) => {
        const next = `${label}: ${String(value || '').trim()}`.trim();
        if (!next || issues.includes(next)) {
          return;
        }
        issues.push(next);
      };

      const renderDiagnostics = (status) => {
        if (!diagnostics) {
          return;
        }
        const lines = [
          `status: ${status}`,
          `url: ${window.location.href}`,
          `readyState: ${document.readyState}`,
          `elapsedMs: ${Date.now() - startedAt}`,
          `bodyChildren: ${document.body ? document.body.children.length : 0}`,
          `flutterNodes: ${document.querySelectorAll(flutterRootSelector).length}`,
          `paintedNodes: ${document.querySelectorAll(paintedRootSelector).length}`,
          ...issues,
        ];
        diagnostics.textContent = lines.join('\n');
      };

      const hasFlutterRoot = () =>
        !!document.querySelector(flutterRootSelector);

      const hasPaintedFlutter = () => {
        const painted = Array.from(document.querySelectorAll(paintedRootSelector)).some((node) => {
          const rect = node.getBoundingClientRect();
          return rect.width > 0 && rect.height > 0;
        });
        if (painted) {
          return true;
        }

        const flutterView = document.querySelector('flutter-view');
        const semanticsHost = document.querySelector('flt-semantics-host');
        if (!flutterView || !semanticsHost) {
          return false;
        }

        const viewRect = flutterView.getBoundingClientRect();
        if (viewRect.width <= 0 || viewRect.height <= 0) {
          return false;
        }

        return Array.from(semanticsHost.querySelectorAll('flt-semantics')).some((node) => {
          const rect = node.getBoundingClientRect();
          return rect.width > 0 && rect.height > 0;
        });
      };

      const markReady = () => {
        if (bootResolved || !hasPaintedFlutter()) {
          return;
        }
        bootResolved = true;
        if (bootProbe) {
          window.clearInterval(bootProbe);
          bootProbe = null;
        }
        renderDiagnostics(timeoutReached ? 'boot-timeout-recovered' : 'boot-ready');
        if (fallback) {
          fallback.dataset.visible = 'false';
        }
      };

      const showFallback = () => {
        if (bootResolved || hasPaintedFlutter()) {
          markReady();
          return;
        }
        if (timeoutReported) {
          renderDiagnostics('boot-timeout');
          return;
        }
        timeoutReported = true;
        renderDiagnostics('boot-timeout');
        console.error('Sentinel Ops boot watchdog timeout', {
          issues,
          url: window.location.href,
          readyState: document.readyState,
          bodyChildren: document.body ? document.body.children.length : 0,
        });
        if (fallback) {
          fallback.dataset.visible = 'true';
        }
      };

      window.addEventListener('error', (event) => {
        pushIssue('error', event.message || event.error?.message || 'unknown');
        renderDiagnostics('boot-error');
      });

      window.addEventListener('unhandledrejection', (event) => {
        const reason = event.reason?.message || event.reason || 'unknown';
        pushIssue('unhandledrejection', reason);
        renderDiagnostics('boot-rejection');
      });

      bootProbe = window.setInterval(() => {
        if (hasPaintedFlutter()) {
          if (bootProbe) {
            window.clearInterval(bootProbe);
            bootProbe = null;
          }
          markReady();
          return;
        }
        if (hasFlutterRoot()) {
          pushIssue('render', 'flutter shell attached but first frame not painted');
        }
        renderDiagnostics(timeoutReached ? 'boot-timeout' : 'boot-waiting');
      }, 500);

      window.setTimeout(() => {
        timeoutReached = true;
        showFallback();
      }, 12000);
    })();
  </script>
  <script>
    (function registerFormFieldIdentityPatch() {
      let rafToken = null;
      let retryCount = 0;

      const normalizeFieldKey = (value, index) => {
        const base = String(value || `field-${index}`)
          .split('\n')[0]
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9\u4e00-\u9fa5]+/g, '-')
          .replace(/^-+|-+$/g, '');
        return base || `field-${index}`;
      };

      const applyFieldIdentity = () => {
        try {
          const seen = new Map();
          const fields = document.querySelectorAll('input, textarea, select');
          fields.forEach((field, index) => {
            const el = /** @type {HTMLInputElement|HTMLTextAreaElement|HTMLSelectElement} */ (field);
            const semanticSeed =
              el.getAttribute('aria-label') ||
              el.getAttribute('placeholder') ||
              el.getAttribute('type') ||
              el.tagName.toLowerCase();
            const key = normalizeFieldKey(semanticSeed, index);
            const nextCount = (seen.get(key) || 0) + 1;
            seen.set(key, nextCount);
            const stableId = `sentinel-${key}${nextCount > 1 ? `-${nextCount}` : ''}`;
            if (!el.id) {
              el.id = stableId;
            }
            if (!el.getAttribute('name')) {
              el.setAttribute('name', stableId);
            }
          });
        } catch (error) {
          console.debug('Skipping form identity patch tick.', error);
        }
      };

      const scheduleApply = () => {
        if (rafToken !== null) {
          return;
        }
        rafToken = window.requestAnimationFrame(() => {
          rafToken = null;
          applyFieldIdentity();
        });
      };

      const bootstrap = () => {
        scheduleApply();
        const warmupWindow = window.setInterval(() => {
          scheduleApply();
          retryCount += 1;
          if (retryCount >= 10) {
            window.clearInterval(warmupWindow);
          }
        }, 500);
        window.setInterval(() => {
          scheduleApply();
        }, 3000);
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootstrap, { once: true });
      } else {
        bootstrap();
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
