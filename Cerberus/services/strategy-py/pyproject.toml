[project]
name = "cerberus-strategy"
version = "0.1.0"
description = "Quant strategy service for Cerberus"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.128.0,<0.129.0",
  "uvicorn[standard]>=0.40.0,<0.41.0",
  "pandas>=2.2.0,<2.3.0",
  "numpy>=2.3.0,<2.4.0",
  "gurobipy>=13.0.0,<14.0.0",
  "grpcio>=1.76.0,<2.0.0",
  "grpcio-tools>=1.76.0,<2.0.0",
  "protobuf>=6.33.0,<7.0.0",
  "redis[hiredis]>=6.4.0,<7.0.0",
  "pydantic>=2.12.0,<3.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "python-dotenv>=1.1.0,<2.0.0",
  "httpx>=0.28.0,<0.29.0",
  "google-cloud-storage>=3.4.1,<4.0.0",
  "firebase-admin>=7.1.0,<8.0.0",
  "onnxruntime>=1.23.0,<2.0.0"
]

[dependency-groups]
dev = [
  "pytest>=8.4.0,<9.0.0",
  "pytest-asyncio>=1.2.0,<2.0.0",
  "ruff>=0.14.0,<0.15.0",
  "mypy>=1.18.0,<2.0.0",
  "torch>=2.6.0,<3.0.0"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
