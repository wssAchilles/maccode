name: deploy-dev

on:
  workflow_dispatch:
  push:
    branches: ["main"]

env:
  PROJECT_ID: cerberus-9d94f
  REGION: asia-east2
  REGISTRY: asia-east2-docker.pkg.dev
  REPOSITORY: cerberus

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      cloud_run_gateway_url: ${{ steps.tf_outputs.outputs.cloud_run_gateway_url }}
      cloud_run_strategy_url: ${{ steps.tf_outputs.outputs.cloud_run_strategy_url }}
      cloud_run_matching_url: ${{ steps.tf_outputs.outputs.cloud_run_matching_url }}
      frontend_url: ${{ steps.frontend_outputs.outputs.frontend_url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate deploy secrets policy
        env:
          GRB_LICENSEID: ${{ secrets.GRB_LICENSEID }}
          GRB_WLSACCESSID: ${{ secrets.GRB_WLSACCESSID }}
          GRB_WLSSECRET: ${{ secrets.GRB_WLSSECRET }}
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          JWT_HS256_SECRET: ${{ secrets.JWT_HS256_SECRET }}
          DEPLOY_ENV: "dev"
          CORS_ALLOW_ORIGINS: "https://cerberus-9d94f.web.app,https://cerberus-9d94f.firebaseapp.com"
          FIREBASE_AUTH_REQUIRED: "true"
          INTERNAL_SERVICES_INGRESS: "true"
          STRATEGY_PUBLIC_ACCESS: "false"
          MATCHING_PUBLIC_ACCESS: "false"
          JWT_AUTH_REQUIRE_IN_PRODUCTION: "true"
        run: |
          chmod +x scripts/validate_deploy_policy.sh
          ./scripts/validate_deploy_policy.sh

      - name: Docker auth
        run: gcloud auth configure-docker $REGISTRY --quiet

      - name: Build and push images
        run: |
          docker build -t $REGISTRY/$PROJECT_ID/$REPOSITORY/gateway:${GITHUB_SHA} services/gateway-rs
          docker build -t $REGISTRY/$PROJECT_ID/$REPOSITORY/strategy:${GITHUB_SHA} services/strategy-py
          docker build -t $REGISTRY/$PROJECT_ID/$REPOSITORY/matching:${GITHUB_SHA} services/matching-cpp
          docker push $REGISTRY/$PROJECT_ID/$REPOSITORY/gateway:${GITHUB_SHA}
          docker push $REGISTRY/$PROJECT_ID/$REPOSITORY/strategy:${GITHUB_SHA}
          docker push $REGISTRY/$PROJECT_ID/$REPOSITORY/matching:${GITHUB_SHA}

      - name: Terraform apply
        env:
          TF_VAR_project_id: ${{ env.PROJECT_ID }}
          TF_VAR_region: ${{ env.REGION }}
          TF_VAR_gurobi_licenseid: ${{ secrets.GRB_LICENSEID }}
          TF_VAR_gurobi_wlsaccessid: ${{ secrets.GRB_WLSACCESSID }}
          TF_VAR_gurobi_wlssecret: ${{ secrets.GRB_WLSSECRET }}
          TF_VAR_upstash_redis_url: ${{ secrets.UPSTASH_REDIS_URL }}
          TF_VAR_upstash_redis_rest_url: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          TF_VAR_upstash_redis_rest_token: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          TF_VAR_supabase_project_url: ${{ secrets.SUPABASE_PROJECT_URL }}
          TF_VAR_supabase_anon_key: ${{ secrets.SUPABASE_ANON_KEY }}
          TF_VAR_supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TF_VAR_supabase_db_url: ${{ secrets.SUPABASE_DB_URL }}
          TF_VAR_firebase_web_api_key: ${{ secrets.FIREBASE_API_KEY }}
          TF_VAR_binance_api_key: ${{ secrets.BINANCE_API_KEY }}
          TF_VAR_binance_api_secret: ${{ secrets.BINANCE_API_SECRET }}
          TF_VAR_alpaca_api_key: ${{ secrets.ALPACA_API_KEY }}
          TF_VAR_alpaca_api_secret: ${{ secrets.ALPACA_API_SECRET }}
          TF_VAR_jwt_hs256_secret: ${{ secrets.JWT_HS256_SECRET }}
          TF_VAR_environment: dev
          TF_VAR_firebase_project_id: cerberus-9d94f
          TF_VAR_firebase_enabled: "true"
          TF_VAR_supabase_enabled: "true"
          TF_VAR_firebase_auth_required: "true"
          TF_VAR_jwt_auth_enabled: "false"
          TF_VAR_jwt_auth_require_in_production: "true"
          TF_VAR_matching_enabled: "true"
          TF_VAR_strategy_internal_auth_enabled: "true"
          TF_VAR_strategy_internal_auth_token_ttl_seconds: "300"
          TF_VAR_strategy_internal_auth_metadata_identity_url: "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/identity"
          TF_VAR_strategy_upstream_timeout_ms: "1800"
          TF_VAR_strategy_upstream_health_timeout_ms: "1500"
          TF_VAR_strategy_upstream_max_inflight: "64"
          TF_VAR_strategy_upstream_queue_timeout_ms: "250"
          TF_VAR_strategy_upstream_circuit_enabled: "true"
          TF_VAR_strategy_upstream_circuit_failure_threshold: "6"
          TF_VAR_strategy_upstream_circuit_open_ms: "15000"
          TF_VAR_strategy_summary_cache_ttl_ms: "1500"
          TF_VAR_strategy_summary_batch_window_ms: "120"
          TF_VAR_redis_market_events_stream_enabled: "true"
          TF_VAR_redis_market_events_stream_key: "cerberus.market.events"
          TF_VAR_redis_market_events_stream_maxlen: "50000"
          TF_VAR_redis_market_events_publish_legacy_pubsub: "true"
          TF_VAR_redis_order_events_stream_enabled: "true"
          TF_VAR_redis_order_events_stream_key: "cerberus.order.events"
          TF_VAR_redis_order_events_consumer_group: "gateway-orders"
          TF_VAR_redis_order_events_consumer_name: ""
          TF_VAR_redis_order_events_read_batch_size: "64"
          TF_VAR_redis_order_events_read_block_ms: "3000"
          TF_VAR_redis_order_events_pending_replay_count: "128"
          TF_VAR_redis_order_events_batch_window_ms: "100"
          TF_VAR_redis_order_events_max_retries_before_fallback: "6"
          TF_VAR_redis_order_events_retry_backoff_ms: "200"
          TF_VAR_redis_order_events_retry_backoff_max_ms: "5000"
          TF_VAR_redis_order_events_reclaim_enabled: "true"
          TF_VAR_redis_order_events_reclaim_interval_ms: "5000"
          TF_VAR_redis_order_events_reclaim_idle_ms: "30000"
          TF_VAR_redis_order_events_reclaim_batch_size: "64"
          TF_VAR_redis_order_events_max_delivery_attempts: "8"
          TF_VAR_redis_order_events_poison_stream_key: "cerberus.order.events.poison"
          TF_VAR_redis_order_events_poison_stream_maxlen: "20000"
          TF_VAR_redis_order_events_pending_warn_threshold: "2000"
          TF_VAR_redis_order_events_lag_warn_threshold: "2000"
          TF_VAR_market_stream_enabled: "true"
          TF_VAR_market_stream_consumer_group: "strategy-market"
          TF_VAR_market_stream_reclaim_enabled: "true"
          TF_VAR_market_stream_reclaim_interval_ms: "5000"
          TF_VAR_market_stream_reclaim_idle_ms: "30000"
          TF_VAR_market_stream_reclaim_batch_size: "64"
          TF_VAR_market_stream_max_delivery_attempts: "8"
          TF_VAR_market_stream_pending_warn_threshold: "2000"
          TF_VAR_market_stream_lag_warn_threshold: "2000"
          TF_VAR_market_stream_poison_stream_key: "cerberus.market.events.poison"
          TF_VAR_market_stream_poison_stream_maxlen: "20000"
          TF_VAR_market_stream_legacy_pubsub_fallback: "true"
          TF_VAR_strategy_event_stream_maxlen: "10000"
          TF_VAR_matching_grpc_max_pollers: "16"
          TF_VAR_matching_grpc_min_pollers: "4"
          TF_VAR_matching_grpc_num_cqs: "4"
          TF_VAR_matching_execution_stream_limit: "500"
          TF_VAR_matching_submit_latency_window_size: "1024"
          TF_VAR_matching_backpressure_retry_sleep_ms: "1"
          TF_VAR_cloud_run_gateway: >-
            {"min_instance_count":1,"max_instance_count":30,"max_instance_request_concurrency":80,"timeout_seconds":900,"cpu":"1","memory":"1Gi","cpu_idle":false,"startup_cpu_boost":true}
          TF_VAR_cloud_run_strategy: >-
            {"min_instance_count":1,"max_instance_count":20,"max_instance_request_concurrency":20,"timeout_seconds":300,"cpu":"2","memory":"2Gi","cpu_idle":false,"startup_cpu_boost":true}
          TF_VAR_cloud_run_matching: >-
            {"min_instance_count":1,"max_instance_count":20,"max_instance_request_concurrency":16,"timeout_seconds":120,"cpu":"2","memory":"2Gi","cpu_idle":false,"startup_cpu_boost":true}
          TF_VAR_cors_allow_origins: "https://cerberus-9d94f.web.app,https://cerberus-9d94f.firebaseapp.com"
          TF_VAR_internal_services_ingress: "true"
          TF_VAR_strategy_public_access: "false"
          TF_VAR_matching_public_access: "false"
          TF_VAR_container_images: >-
            {"gateway":"${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/gateway:${{ github.sha }}","strategy":"${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/strategy:${{ github.sha }}","matching":"${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/matching:${{ github.sha }}"}
        run: |
          cd infra/terraform
          terraform init
          terraform apply -auto-approve

      - name: Export Terraform outputs
        id: tf_outputs
        run: |
          CLOUD_RUN_GATEWAY_URL="$(cd infra/terraform && terraform output -raw cloud_run_gateway_url)"
          CLOUD_RUN_STRATEGY_URL="$(cd infra/terraform && terraform output -raw cloud_run_strategy_url)"
          CLOUD_RUN_MATCHING_URL="$(cd infra/terraform && terraform output -raw cloud_run_matching_url)"
          echo "cloud_run_gateway_url=$CLOUD_RUN_GATEWAY_URL" >> "$GITHUB_OUTPUT"
          echo "cloud_run_strategy_url=$CLOUD_RUN_STRATEGY_URL" >> "$GITHUB_OUTPUT"
          echo "cloud_run_matching_url=$CLOUD_RUN_MATCHING_URL" >> "$GITHUB_OUTPUT"

      - name: Deploy gate backend SLO
        env:
          GATEWAY_BASE_URL: ${{ steps.tf_outputs.outputs.cloud_run_gateway_url }}
          GATEWAY_PERF_REQUESTS: "40"
          GATEWAY_PERF_MAX_P95_MS: "800"
          GATEWAY_PERF_MIN_RPS: "2"
          GATEWAY_PERF_MAX_UNIT_COST_USD: "0.01"
        run: python scripts/gateway_perf_gate.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd apps/frontend && npm ci

      - name: Build frontend for Firebase Hosting
        env:
          VITE_GATEWAY_BASE: ${{ steps.tf_outputs.outputs.cloud_run_gateway_url }}
          VITE_PUBLIC_APP_URL: ${{ secrets.FIREBASE_HOSTING_URL || format('https://{0}.web.app', env.PROJECT_ID) }}
          VITE_AUTH_REQUIRED: "true"
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: cerberus-9d94f
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: cd apps/frontend && npm run build

      - name: Frontend bundle budget gate
        run: cd apps/frontend && npm run check:bundle-budget

      - name: Deploy Firebase Hosting (live)
        run: npx firebase-tools deploy --project $PROJECT_ID --only hosting --non-interactive

      - name: Export frontend URL
        id: frontend_outputs
        run: |
          FRONTEND_URL="${{ secrets.FIREBASE_HOSTING_URL }}"
          if [ -z "$FRONTEND_URL" ]; then
            FRONTEND_URL="https://${PROJECT_ID}.web.app"
          fi
          echo "frontend_url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"

  frontend-deploy-gate:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Resolve deployed frontend URL
        id: resolve_url
        run: |
          FRONTEND_URL="${{ needs.deploy.outputs.frontend_url }}"
          if [ -z "$FRONTEND_URL" ]; then
            echo "frontend URL is empty" >&2
            exit 1
          fi
          echo "frontend_url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: cd apps/frontend && npm ci

      - name: Install Playwright browser
        run: cd apps/frontend && npx playwright install --with-deps chromium

      - name: Deploy gate hosting security and asset policy
        env:
          FRONTEND_URL: ${{ steps.resolve_url.outputs.frontend_url }}
        run: ./scripts/validate_frontend_hosting.sh

      - name: Deploy gate e2e (desktop + mobile)
        env:
          E2E_BASE_URL: ${{ steps.resolve_url.outputs.frontend_url }}
          E2E_GATE_MODE: "true"
          E2E_USE_DEPLOYED: "true"
          E2E_AUTH_EMAIL: ${{ secrets.FIREBASE_E2E_EMAIL }}
          E2E_AUTH_PASSWORD: ${{ secrets.FIREBASE_E2E_PASSWORD }}
        run: cd apps/frontend && npm run test:e2e:gate

      - name: Deploy gate lighthouse SLO
        env:
          LHCI_COLLECT_URL: ${{ steps.resolve_url.outputs.frontend_url }}
        run: cd apps/frontend && npm run lighthouse:gate

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-deploy-gate-playwright
          path: |
            apps/frontend/test-results
            apps/frontend/playwright-report
          if-no-files-found: ignore

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-deploy-gate-lighthouse
          path: apps/frontend/.lighthouseci
          if-no-files-found: ignore
