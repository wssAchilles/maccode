version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/protocolbuffers/python:v31.1
    out: ../services/strategy-py/app/gen
  - remote: buf.build/grpc/python
    out: ../services/strategy-py/app/gen
  - remote: buf.build/protocolbuffers/cpp
    out: ../services/matching-cpp/gen
  - remote: buf.build/grpc/cpp
    out: ../services/matching-cpp/gen
  - remote: buf.build/bufbuild/es
    out: ../apps/frontend/src/gen
    opt:
      - target=ts
  - remote: buf.build/community/neoeinstein-prost:v0.4.0
    out: ../services/gateway-rs/src/gen
