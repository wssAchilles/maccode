syntax = "proto3";

package cerberus.strategy.v1;

service StrategyService {
  rpc EvaluateSignal(EvaluateSignalRequest) returns (EvaluateSignalResponse);
  rpc Rebalance(RebalanceRequest) returns (RebalanceResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message EvaluateSignalRequest {
  string strategy_id = 1;
  string symbol = 2;
}

message EvaluateSignalResponse {
  string strategy_id = 1;
  string symbol = 2;
  string signal = 3;
  double confidence = 4;
}

message RebalanceRequest {
  string strategy_id = 1;
}

message RebalanceResponse {
  bool accepted = 1;
  string message = 2;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string version = 2;
}
