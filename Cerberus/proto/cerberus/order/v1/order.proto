syntax = "proto3";

package cerberus.order.v1;

import "google/protobuf/timestamp.proto";

service OrderService {
  rpc SubmitOrder(SubmitOrderRequest) returns (SubmitOrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc GetOrderBook(GetOrderBookRequest) returns (GetOrderBookResponse);
  rpc StreamExecutions(StreamExecutionsRequest) returns (stream StreamExecutionsResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc GetServiceStats(GetServiceStatsRequest) returns (GetServiceStatsResponse);
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_NEW = 1;
  ORDER_STATUS_PARTIALLY_FILLED = 2;
  ORDER_STATUS_FILLED = 3;
  ORDER_STATUS_CANCELED = 4;
  ORDER_STATUS_REJECTED = 5;
}

message SubmitOrderRequest {
  string account_id = 1;
  string symbol = 2;
  Side side = 3;
  OrderType order_type = 4;
  double price = 5;
  double quantity = 6;
  string client_order_id = 7;
  string idempotency_key = 8;
  string schema_version = 9;
  string correlation_id = 10;
}

message SubmitOrderResponse {
  bool accepted = 1;
  string order_id = 2;
  string reason = 3;
  string schema_version = 4;
  string correlation_id = 5;
}

message CancelOrderRequest {
  string account_id = 1;
  string order_id = 2;
  string schema_version = 3;
  string correlation_id = 4;
}

message CancelOrderResponse {
  bool canceled = 1;
  string reason = 2;
  string schema_version = 3;
  string correlation_id = 4;
}

message GetOrderRequest {
  string account_id = 1;
  string order_id = 2;
  string schema_version = 3;
  string correlation_id = 4;
}

message GetOrderResponse {
  string order_id = 1;
  string account_id = 2;
  string symbol = 3;
  Side side = 4;
  OrderType order_type = 5;
  double price = 6;
  double quantity = 7;
  double filled_quantity = 8;
  OrderStatus status = 9;
  google.protobuf.Timestamp updated_at = 10;
  string schema_version = 11;
  string correlation_id = 12;
}

message GetOrderBookRequest {
  string symbol = 1;
  uint32 depth = 2;
  string schema_version = 3;
  string correlation_id = 4;
}

message OrderBookLevel {
  double price = 1;
  double total_quantity = 2;
  uint64 order_count = 3;
}

message GetOrderBookResponse {
  string symbol = 1;
  repeated OrderBookLevel bids = 2;
  repeated OrderBookLevel asks = 3;
  uint64 generated_at_ms = 4;
  string schema_version = 5;
  string correlation_id = 6;
}

message StreamExecutionsRequest {
  string account_id = 1;
  string schema_version = 2;
  string correlation_id = 3;
}

message StreamExecutionsResponse {
  string execution_id = 1;
  string order_id = 2;
  string symbol = 3;
  double price = 4;
  double quantity = 5;
  google.protobuf.Timestamp event_time = 6;
  string schema_version = 7;
  string correlation_id = 8;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string service = 2;
  string version = 3;
  uint64 uptime_seconds = 4;
  string schema_version = 5;
  string correlation_id = 6;
}

message GetServiceStatsRequest {}

message GetServiceStatsResponse {
  uint64 live_orders = 1;
  uint64 trade_count = 2;
  uint64 tracked_orders = 3;
  uint64 rejected_orders = 4;
  uint64 symbols = 5;
  bool has_best_bid = 6;
  double best_bid = 7;
  bool has_best_ask = 8;
  double best_ask = 9;
  string schema_version = 10;
  string correlation_id = 11;
  uint64 submit_order_requests_total = 12;
  uint64 submit_order_errors_total = 13;
  uint64 submit_order_rejections_total = 14;
  double submit_order_latency_p95_ms = 15;
  double submit_order_throughput_rps = 16;
  double trade_throughput_rps = 17;
}
