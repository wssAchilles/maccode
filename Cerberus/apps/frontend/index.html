<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4efe5" />
    <meta
      name="description"
      content="Cerberus industrial trading terminal with real-time market stream, execution timeline, and risk-aware order workflow."
    />
    <meta name="application-name" content="Cerberus Terminal" />
    <meta name="apple-mobile-web-app-title" content="Cerberus" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cerberus Terminal" />
    <meta
      property="og:description"
      content="Industrial trading workspace for live market stream, execution orchestration, and service health."
    />
    <meta property="og:image" content="__APP_OG_IMAGE_URL__" />
    <meta property="og:url" content="__APP_PUBLIC_URL__" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cerberus Terminal" />
    <meta
      name="twitter:description"
      content="Industrial trading workspace for live market stream, execution orchestration, and service health."
    />
    <meta name="twitter:image" content="__APP_OG_IMAGE_URL__" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="__APP_PUBLIC_URL__" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      .boot-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(14, 165, 233, 0.14), transparent 32%),
          linear-gradient(180deg, #f5f1e8 0%, #efe5d7 100%);
        color: #102030;
        font-family:
          "SF Pro Display",
          "Segoe UI",
          sans-serif;
      }

      .boot-panel {
        width: min(520px, 100%);
        border-radius: 28px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.12);
        padding: 28px;
      }

      .boot-kicker {
        margin: 0;
        color: #0369a1;
        font: 700 0.78rem/1.4 "SF Pro Text", "Segoe UI", sans-serif;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .boot-title {
        margin: 12px 0 0;
        color: #102030;
        font: 700 clamp(2rem, 4vw, 2.6rem)/1.04 "SF Pro Display", "Segoe UI", sans-serif;
        letter-spacing: -0.03em;
      }

      .boot-subtitle {
        margin: 10px 0 0;
        color: #334155;
        font: 500 1rem/1.55 "SF Pro Text", "Segoe UI", sans-serif;
      }

      .boot-status {
        min-height: 1.25rem;
        margin: 24px 0 0;
        color: #475569;
        font: 600 0.78rem/1.4 "SF Pro Text", "Segoe UI", sans-serif;
        letter-spacing: 0.02em;
      }

      .boot-lines {
        display: grid;
        gap: 12px;
        margin-top: 24px;
      }

      .boot-line {
        border-radius: 14px;
        background: rgba(148, 163, 184, 0.18);
      }

      .boot-line-lg {
        height: 52px;
      }

      .boot-actions {
        display: grid;
        gap: 12px;
        margin-top: 16px;
      }

      .boot-line-sm {
        height: 46px;
      }
    </style>
    <title>Cerberus Terminal</title>
  </head>
  <body class="bg-bg text-white">
    <div id="root">
      <main class="boot-shell" aria-label="Cerberus boot shell">
        <section class="boot-panel">
          <p class="boot-kicker">实时决策 · 低干扰</p>
          <h1 class="boot-title">Cerberus 交易工作台</h1>
          <p class="boot-subtitle">交易终端</p>
          <p class="boot-status">正在准备工作台…</p>
          <div class="boot-lines" aria-hidden="true">
            <div class="boot-line boot-line-lg"></div>
            <div class="boot-line boot-line-lg"></div>
          </div>
          <div class="boot-actions" aria-hidden="true">
            <div class="boot-line boot-line-sm"></div>
            <div class="boot-line boot-line-sm"></div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
