schema_version: 1
notes: 'Scene-level calibration presets for real traffic video analysis. Add per-video
  surveyed ground-control points under video_calibrations to upgrade from scene_profile_preset
  to video_manual_preset.

  '
scene_profiles:
  wide_signalized_intersection:
    world_width_m: 28.0
    world_length_m: 75.0
    position_rmse_floor_m: 1.5
    calibration_scale_uncertainty_pct: 8.0
    line_y_ratio: 0.72
    line_x_start_ratio: 0.18
    line_x_end_ratio: 0.88
    notes: Wide fixed elevated intersection preset.
  red_light_static:
    world_width_m: 24.0
    world_length_m: 65.0
    position_rmse_floor_m: 1.5
    calibration_scale_uncertainty_pct: 8.0
    line_y_ratio: 0.72
    line_x_start_ratio: 0.2
    line_x_end_ratio: 0.86
    notes: Signalized road preset focused on approach and stop-line behavior.
  pedestrian_high_view:
    world_width_m: 22.0
    world_length_m: 45.0
    position_rmse_floor_m: 1.2
    calibration_scale_uncertainty_pct: 8.0
    line_y_ratio: 0.68
    line_x_start_ratio: 0.1
    line_x_end_ratio: 0.9
    notes: High-view pedestrian and cyclist preset.
  dense_city_traffic_4k:
    world_width_m: 38.0
    world_length_m: 110.0
    position_rmse_floor_m: 2.0
    calibration_scale_uncertainty_pct: 12.0
    line_y_ratio: 0.7
    line_x_start_ratio: 0.18
    line_x_end_ratio: 0.86
    notes: 4K dense elevated traffic preset with a larger uncertainty floor.
