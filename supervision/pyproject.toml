[project]
name = "traffic-perception-engine"
version = "0.1.0"
description = "TrafficPerceptionEngine foundation for CV traffic analytics and speed estimation."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
cv = [
    "opencv-python>=4.8.0",
    "supervision>=0.25.0",
    "ultralytics>=8.0.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "openai>=1.0.0",
    "python-multipart>=0.0.6",
    "structlog>=23.0.0",
]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.15.0",
    "mypy>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["\\.venv", "frontend"]
